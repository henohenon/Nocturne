<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nocturne</title>
  <style>
    :root {
      --ink: #0e0e16;
      --gold: #bc912f;
      --gold-soft: rgba(188, 145, 47, 0.38);
      --gold-faint: rgba(188, 145, 47, 0.14);
      --bone: #e9e2cf;
      --muted: #8b8575;
      --crimson: #c8283c;
      --blood: #8e1426;
      --serif: Georgia, 'Yu Mincho', 'YuMincho', 'Hiragino Mincho ProN', serif;
      --sans: 'Segoe UI', 'Yu Gothic UI', 'Hiragino Sans', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 240px;
      padding: 16px;
      font-family: var(--sans);
      font-size: 14px;
      background: var(--ink);
      color: var(--bone);
      box-shadow: inset 0 0 0 1px var(--gold-faint);
    }

    /* Header - mark + wordmark */
    header { display: flex; align-items: center; gap: 10px; }
    header svg { width: 28px; height: 28px; flex: none; }
    .wordmark { font-family: var(--serif); font-size: 19px; letter-spacing: 0.14em; color: var(--gold); transition: color 0.35s, text-shadow 0.35s; }

    /*
     * Mark - the closed gold eye; while the seal is broken it opens red like the toolbar icon.
     * Hovering "re-enable" previews the seal: the lid comes down and the gold returns.
     */
    .frame { stroke: var(--gold); transition: stroke 0.35s; }
    .tint { fill: var(--gold); stroke: var(--gold); transition: fill 0.35s, stroke 0.35s; }
    .lids { opacity: 0; transition: opacity 0s linear 0.35s; }
    .lid, .lid-band { transition: d 0.35s cubic-bezier(0.3, 0.7, 0.2, 1); }
    .lid { d: path('M24.6 45 Q64 110 103.4 45 A40 40 0 0 1 24.6 45 Z'); }
    .lid-band { d: path('M24.6 45 Q64 110 103.4 45 Q64 122 24.6 45 Z'); }
    .disc { fill: var(--gold); r: var(--r0); transition: fill 0.35s, r 0.35s; }
    .dot { transform-box: fill-box; transform-origin: center; transform: scaleY(0); transition: transform 0.35s cubic-bezier(0.3, 0.7, 0.2, 1); }
    body.broken:not(:has(#action:is(:hover, :focus-visible))) {
      & .wordmark { color: var(--crimson); text-shadow: 0 0 10px rgba(200, 40, 60, 0.45); }
      & .frame { stroke: var(--crimson); }
      & .tint { fill: var(--blood); stroke: var(--blood); }
      & .lids { opacity: 1; transition-delay: 0s; }
      & .lid { d: path('M24.6 45 Q64 -8 103.4 45 A40 40 0 0 1 24.6 45 Z'); }
      & .lid-band { d: path('M24.6 45 Q64 -8 103.4 45 Q64 4 24.6 45 Z'); }
      & .disc { fill: #050307; r: var(--r1); }
      & .dot { transform: scaleY(1); }
    }
    .rule { height: 1px; margin: 14px 0 12px; background: linear-gradient(90deg, transparent, var(--gold-soft), transparent); }

    /* Status - gold while sealed, bone while disabled, muted at night */
    #status {
      display: flex;
      align-items: baseline;
      gap: 8px;
      font-family: var(--serif);
      font-size: 21px;
      letter-spacing: 0.06em;
      color: var(--gold);
    }
    #status.off { color: var(--bone); }
    #status.night { color: var(--muted); }
    #status .time { font-family: var(--sans); font-size: 18px; font-variant-numeric: tabular-nums; }
    #note { font-size: 12px; color: var(--muted); margin: 4px 0 14px; min-height: 1em; }

    /* Action button - disable is quiet but ominous, re-enable is the calm primary */
    #action {
      width: 100%;
      padding: 9px 12px;
      border-radius: 6px;
      font-family: var(--sans);
      font-size: 13px;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: background 0.15s;
    }
    #action.danger { background: transparent; border: 1px solid var(--gold-soft); color: var(--gold); }
    #action.danger:hover { background: var(--gold-faint); }
    #action.enable { background: var(--gold); border: 1px solid var(--gold); color: var(--ink); font-weight: 600; }
    #action[hidden] { display: none; }

    /* Night seal toggle */
    .seal {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 12px;
      border: 1px solid var(--gold-soft);
      border-radius: 6px;
      font-size: 13px;
      letter-spacing: 0.08em;
      color: var(--gold);
      cursor: pointer;
    }
    .seal[hidden] { display: none; }
    .seal input { position: absolute; opacity: 0; pointer-events: none; }
    .switch {
      position: relative;
      flex: none;
      width: 34px;
      height: 18px;
      border: 1px solid var(--gold-soft);
      border-radius: 9px;
      transition: background 0.15s, border-color 0.15s;
    }
    .switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--muted);
      transition: transform 0.15s, background 0.15s;
    }
    .seal input:checked + .switch { background: var(--gold); border-color: var(--gold); }
    .seal input:checked + .switch::after { transform: translateX(16px); background: var(--ink); }
    .seal input:focus-visible + .switch { outline: 1px solid var(--gold); outline-offset: 2px; }
  </style>
</head>
<body>
  <header>
    <svg viewBox="0 0 128 128" aria-hidden="true">
      <defs>
        <mask id="lid-mask"><rect width="128" height="128" fill="white"/><circle cx="64" cy="36" r="40" fill="black"/></mask>
        <clipPath id="opening"><path class="lid"/></clipPath>
      </defs>
      <rect width="128" height="128" rx="28" fill="#0e0e16"/>
      <rect class="frame" x="2.75" y="2.75" width="122.5" height="122.5" rx="25.75" fill="none" stroke-width="4.5"/>
      <g class="lids">
        <path class="lid" fill="#1a070b"/>
        <g clip-path="url(#opening)"><circle cx="64" cy="48" r="19" fill="#ff2a3d"/><circle cx="64" cy="48" r="3.6" fill="#07070b"/></g>
        <path class="lid-band tint" style="stroke: none"/>
      </g>
      <circle class="tint" cx="64" cy="50" r="40" mask="url(#lid-mask)" style="stroke: none"/>
      <g class="tint" stroke-width="6.5" stroke-linecap="round"><line x1="64" y1="86" x2="64" y2="107.2"/><line x1="41.25" y1="76.95" x2="29.45" y2="95.3"/><line x1="86.75" y1="76.95" x2="98.55" y2="95.3"/></g>
      <circle class="disc" cx="100" cy="26" r="4.4" style="--r0: 4.4px; --r1: 6px"/>
      <ellipse class="dot" cx="100" cy="26" rx="2.5" ry="2.5" fill="#ff2a3d"/>
      <circle class="disc" cx="84" cy="16" r="2.75" style="--r0: 2.75px; --r1: 4px"/>
      <ellipse class="dot" cx="84" cy="16" rx="1.7" ry="1.7" fill="#ff2a3d"/>
    </svg>
    <span class="wordmark">Nocturne</span>
  </header>
  <div class="rule"></div>
  <div id="status">有効</div>
  <div id="note"></div>
  <label id="seal-row" class="seal" hidden>
    <span>今夜も封印する</span>
    <input id="seal" type="checkbox" role="switch">
    <span class="switch" aria-hidden="true"></span>
  </label>
  <button id="action" class="danger">無効化…</button>
  <script type="module" src="./main.ts"></script>
</body>
</html>
