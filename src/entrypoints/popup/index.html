<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nocturne</title>
  <style>
    :root {
      --ink: #0e0e16;
      --gold: #bc912f;
      --gold-soft: rgba(188, 145, 47, 0.38);
      --gold-faint: rgba(188, 145, 47, 0.14);
      --bone: #e9e2cf;
      --muted: #8b8575;
      --serif: Georgia, 'Yu Mincho', 'YuMincho', 'Hiragino Mincho ProN', serif;
      --sans: 'Segoe UI', 'Yu Gothic UI', 'Hiragino Sans', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 240px;
      padding: 16px;
      font-family: var(--sans);
      font-size: 14px;
      background: var(--ink);
      color: var(--bone);
      box-shadow: inset 0 0 0 1px var(--gold-faint);
    }

    /* Header - mark + wordmark */
    header { display: flex; align-items: center; gap: 10px; }
    header svg { width: 28px; height: 28px; flex: none; }
    .wordmark { font-family: var(--serif); font-size: 19px; letter-spacing: 0.14em; color: var(--gold); }
    .rule { height: 1px; margin: 14px 0 12px; background: linear-gradient(90deg, transparent, var(--gold-soft), transparent); }

    /* Status - gold while sealed, bone while disabled, muted at night */
    #status {
      display: flex;
      align-items: baseline;
      gap: 8px;
      font-family: var(--serif);
      font-size: 21px;
      letter-spacing: 0.06em;
      color: var(--gold);
    }
    #status.off { color: var(--bone); }
    #status.night { color: var(--muted); }
    #status .time { font-family: var(--sans); font-size: 18px; font-variant-numeric: tabular-nums; }
    #note { font-size: 12px; color: var(--muted); margin: 4px 0 14px; min-height: 1em; }

    /* Action button - disable is quiet but ominous, re-enable is the calm primary */
    #action {
      width: 100%;
      padding: 9px 12px;
      border-radius: 6px;
      font-family: var(--sans);
      font-size: 13px;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: background 0.15s;
    }
    #action.danger { background: transparent; border: 1px solid var(--gold-soft); color: var(--gold); }
    #action.danger:hover { background: var(--gold-faint); }
    #action.enable { background: var(--gold); border: 1px solid var(--gold); color: var(--ink); font-weight: 600; }
    #action[hidden] { display: none; }

    /* Night seal toggle */
    .seal {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 12px;
      border: 1px solid var(--gold-soft);
      border-radius: 6px;
      font-size: 13px;
      letter-spacing: 0.08em;
      color: var(--gold);
      cursor: pointer;
    }
    .seal[hidden] { display: none; }
    .seal input { position: absolute; opacity: 0; pointer-events: none; }
    .switch {
      position: relative;
      flex: none;
      width: 34px;
      height: 18px;
      border: 1px solid var(--gold-soft);
      border-radius: 9px;
      transition: background 0.15s, border-color 0.15s;
    }
    .switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--muted);
      transition: transform 0.15s, background 0.15s;
    }
    .seal input:checked + .switch { background: var(--gold); border-color: var(--gold); }
    .seal input:checked + .switch::after { transform: translateX(16px); background: var(--ink); }
    .seal input:focus-visible + .switch { outline: 1px solid var(--gold); outline-offset: 2px; }
  </style>
</head>
<body>
  <header>
    <svg viewBox="0 0 128 128" aria-hidden="true">
      <defs><mask id="lid"><rect width="128" height="128" fill="white"/><circle cx="64" cy="36" r="40" fill="black"/></mask></defs>
      <rect width="128" height="128" rx="28" fill="#0e0e16"/>
      <rect x="2.75" y="2.75" width="122.5" height="122.5" rx="25.75" fill="none" stroke="#bc912f" stroke-width="4.5"/>
      <circle cx="64" cy="50" r="40" fill="#bc912f" mask="url(#lid)"/>
      <g stroke="#bc912f" stroke-width="6.5" stroke-linecap="round"><line x1="64" y1="86" x2="64" y2="107.2"/><line x1="41.25" y1="76.95" x2="29.45" y2="95.3"/><line x1="86.75" y1="76.95" x2="98.55" y2="95.3"/></g>
      <circle cx="100" cy="26" r="4.4" fill="#bc912f"/><circle cx="84" cy="16" r="2.75" fill="#bc912f"/>
    </svg>
    <span class="wordmark">Nocturne</span>
  </header>
  <div class="rule"></div>
  <div id="status">有効</div>
  <div id="note"></div>
  <label id="seal-row" class="seal" hidden>
    <span>今夜も封印する</span>
    <input id="seal" type="checkbox" role="switch">
    <span class="switch" aria-hidden="true"></span>
  </label>
  <button id="action" class="danger">無効化…</button>
  <script type="module" src="./main.ts"></script>
</body>
</html>
