<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nocturne - 封印を解く</title>
  <style>
    :root {
      --ink: #0e0e16;
      --void: #07070b;
      --gold: #bc912f;
      --gold-soft: rgba(188, 145, 47, 0.38);
      --gold-faint: rgba(188, 145, 47, 0.14);
      --bone: #e9e2cf;
      --muted: #8b8575;
      --crimson: #c8283c;
      --blood: #8e1426;
      --glare: #ff2a3d;
      --serif: Georgia, 'Yu Mincho', 'YuMincho', 'Hiragino Mincho ProN', serif;
      --sans: 'Segoe UI', 'Yu Gothic UI', 'Hiragino Sans', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 28px 40px;
      font-family: var(--sans);
      text-align: center;
      color: var(--bone);
      background:
        radial-gradient(ellipse at 50% 26%, rgba(160, 20, 40, 0.45) 0%, rgba(90, 10, 24, 0.2) 40%, transparent 72%),
        var(--void);
      animation: heartbeat var(--beat, 1.6s) ease-out infinite;
      user-select: none;
    }
    body.confront { animation-duration: 0.9s; }
    /* Heartbeat - --k (0-1, the dread zone of the minutes slider) deepens it */
    @keyframes heartbeat {
      0%, 36%, 100% { box-shadow: inset 0 0 calc(50px + var(--k, 0) * 40px) calc(4px + var(--k, 0) * 10px) rgba(200, 40, 60, 0.22); }
      8% { box-shadow: inset 0 0 calc(100px + var(--k, 0) * 60px) calc(22px + var(--k, 0) * 30px) rgba(200, 40, 60, 0.55); }
      18% { box-shadow: inset 0 0 calc(60px + var(--k, 0) * 40px) calc(8px + var(--k, 0) * 14px) rgba(200, 40, 60, 0.3); }
      26% { box-shadow: inset 0 0 calc(85px + var(--k, 0) * 50px) calc(16px + var(--k, 0) * 24px) rgba(200, 40, 60, 0.45); }
    }
    /* At the maximum the whole window jolts once, then keeps shaking irregularly */
    body.max { animation: heartbeat var(--beat, 1.6s) ease-out infinite, shake 0.42s steps(1) infinite, jolt 0.45s ease-out; }
    /* The shake pushes the page past the window; hide the scrollbar it would bring (only while shaking) */
    html:has(body.max) { overflow: hidden; }
    @keyframes shake {
      0% { transform: translate(0, 0); }
      8% { transform: translate(-2px, 1px) rotate(-0.25deg); }
      17% { transform: translate(3px, -2px); }
      25% { transform: translate(-1px, 2px) rotate(0.3deg); }
      33% { transform: translate(2px, 1px); }
      42% { transform: translate(-3px, -1px) rotate(-0.2deg); }
      50% { transform: translate(1px, -3px); }
      58% { transform: translate(-2px, 2px) rotate(0.25deg); }
      67% { transform: translate(3px, 0); }
      75% { transform: translate(0, -2px) rotate(-0.3deg); }
      83% { transform: translate(-2px, -1px); }
      92% { transform: translate(2px, 2px) rotate(0.2deg); }
    }
    @keyframes jolt {
      0% { transform: translate(0, 0) scale(1); }
      15% { transform: translate(-7px, 4px) scale(1.025) rotate(-0.8deg); }
      30% { transform: translate(6px, -5px) scale(1.02) rotate(0.6deg); }
      50% { transform: translate(-4px, 2px) scale(1.01); }
      75% { transform: translate(2px, -1px); }
      100% { transform: translate(0, 0) scale(1); }
    }

    /* Double gold frame */
    body::before, body::after { content: ''; position: absolute; pointer-events: none; }
    body::before { inset: 10px; border: 1px solid var(--gold-soft); }
    body::after { inset: 15px; border: 1px solid var(--gold-faint); }

    /* Dread overlays - darkness closing in, scanlines; both scale with --k */
    .vignette, .scan { position: fixed; inset: 0; pointer-events: none; }
    .vignette {
      z-index: 0;
      background: radial-gradient(ellipse at 50% 45%, transparent calc(62% - var(--k, 0) * 34%), rgba(0, 0, 0, calc(var(--k, 0) * 0.85)) 100%);
    }
    .scan {
      z-index: 2;
      background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.35) 0 1px, transparent 1px 3px);
      opacity: calc(var(--k, 0) * 0.8);
    }
    /* Controls stay above the scanlines (views must not form their own stacking context) */
    .eye { position: relative; z-index: 1; }
    .buttons, #minutes { position: relative; z-index: 3; }

    /* The eye - starts as the gold closed mark and reddens; the upper lid rises (path morph) to reveal the iris */
    .eye { width: 120px; height: 112px; flex: none; overflow: visible; animation: glow 1.1s ease-in-out 0.2s both; }
    @keyframes glow {
      from { filter: drop-shadow(0 0 10px rgba(188, 145, 47, 0.35)); }
      to { filter: drop-shadow(0 0 16px rgba(220, 40, 60, 0.55)); }
    }
    .tint { fill: var(--gold); stroke: var(--gold); animation: redden 1.1s ease-in-out 0.2s both; }
    @keyframes redden {
      from { fill: var(--gold); stroke: var(--gold); }
      to { fill: var(--blood); stroke: var(--blood); }
    }
    /* The opening, its clip and the lid band share one control point: 110 = shut on the crescent, -8 = open */
    .lids { opacity: 0; animation: reveal 0.01s linear 0.45s both; }
    @keyframes reveal { to { opacity: 1; } }
    .lid { animation: lid-open 1s cubic-bezier(0.3, 0.7, 0.2, 1) 0.45s both, lid-blink 7s ease-in-out 3.2s infinite; }
    .lid-band { stroke: none; animation: band-open 1s cubic-bezier(0.3, 0.7, 0.2, 1) 0.45s both, band-blink 7s ease-in-out 3.2s infinite, redden 1.1s ease-in-out 0.2s both; }
    @keyframes lid-open {
      from { d: path('M24.6 45 Q64 110 103.4 45 A40 40 0 0 1 24.6 45 Z'); }
      72% { d: path('M24.6 45 Q64 -13 103.4 45 A40 40 0 0 1 24.6 45 Z'); }
      to { d: path('M24.6 45 Q64 -8 103.4 45 A40 40 0 0 1 24.6 45 Z'); }
    }
    @keyframes band-open {
      from { d: path('M24.6 45 Q64 110 103.4 45 Q64 122 24.6 45 Z'); }
      72% { d: path('M24.6 45 Q64 -13 103.4 45 Q64 -1 24.6 45 Z'); }
      to { d: path('M24.6 45 Q64 -8 103.4 45 Q64 4 24.6 45 Z'); }
    }
    @keyframes lid-blink {
      0%, 94%, 100% { d: path('M24.6 45 Q64 -8 103.4 45 A40 40 0 0 1 24.6 45 Z'); }
      96.5% { d: path('M24.6 45 Q64 96 103.4 45 A40 40 0 0 1 24.6 45 Z'); }
    }
    @keyframes band-blink {
      0%, 94%, 100% { d: path('M24.6 45 Q64 -8 103.4 45 Q64 4 24.6 45 Z'); }
      96.5% { d: path('M24.6 45 Q64 96 103.4 45 Q64 108 24.6 45 Z'); }
    }
    .iris { transition: transform 0.12s ease-out; }
    .iris-glow { filter: drop-shadow(0 0 6px rgba(255, 42, 61, 0.9)); }

    /* Stars - gold turns to a black disc; the red dot inside opens with the lid and blinks on its own period */
    .disc { animation: disc 0.5s ease-in-out 0.2s both; }
    @keyframes disc {
      from { fill: var(--gold); r: var(--r0); }
      to { fill: #050307; r: var(--r1); }
    }
    .dot-lid { transform-box: fill-box; transform-origin: center; animation: dot-open 1s cubic-bezier(0.3, 0.7, 0.2, 1) 0.45s both, dot-blink var(--period) ease-in-out var(--after) infinite; }
    @keyframes dot-open {
      from { transform: scaleY(0); }
      72% { transform: scaleY(1.12); }
      to { transform: scaleY(1); }
    }
    @keyframes dot-blink {
      0%, 94%, 100% { transform: scaleY(1); }
      96.5% { transform: scaleY(0); }
    }

    /* Dread zone - every eye widens and stops blinking (pupils are slit from script) */
    .widen { transform-box: view-box; transform-origin: 64px 50px; transform: scaleY(var(--wide, 1)); transition: transform 0.2s; }
    .star { transform-box: fill-box; transform-origin: center; transform: scale(var(--wide, 1)); transition: transform 0.2s; }
    body.dread .lid { animation: lid-open 1s cubic-bezier(0.3, 0.7, 0.2, 1) 0.45s both; }
    body.dread .lid-band { animation: band-open 1s cubic-bezier(0.3, 0.7, 0.2, 1) 0.45s both, redden 1.1s ease-in-out 0.2s both; }
    body.dread .dot-lid { animation: dot-open 1s cubic-bezier(0.3, 0.7, 0.2, 1) 0.45s both; }
    body.confront .eye { width: 150px; height: 140px; }
    /* Pupils slit smoothly - on the slider, and in a snap when the eyes awaken */
    .pupil { transition: rx 0.22s cubic-bezier(0.3, 1.6, 0.5, 1), ry 0.22s cubic-bezier(0.3, 1.6, 0.5, 1); }
    /* Streak confrontation awakened (proceed hovered): the beat races, the window trembles */
    body.confront.max { animation: heartbeat 0.5s ease-out infinite, shake 0.42s steps(1) infinite, jolt 0.45s ease-out; }

    /* Heading */
    .kicker { font-size: 11px; letter-spacing: 0.42em; color: var(--gold); }
    h1 {
      font-family: var(--serif);
      font-size: 30px;
      font-weight: 400;
      letter-spacing: 0.18em;
      color: #f0d9d9;
      text-shadow: 0 0 14px rgba(220, 40, 60, 0.6);
    }
    .lead { font-size: 14px; line-height: 1.8; color: #d9cfc0; }
    .lead strong { font-weight: 600; color: #fff; }

    /* Views - main form and the streak confrontation swap in place */
    .view { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; }
    .view[hidden] { display: none; }

    /* Duration slider - one color (--c, set from script) for number, fill and thumb; --g is its glow */
    .duration { width: 100%; margin-top: 4px; }
    /* Georgia's old-style figures (3, 4, 5, 7, 9) descend into the line below; use lining figures */
    .minutes, .count strong { font-variant-numeric: lining-nums; }
    .minutes {
      font-family: var(--serif);
      font-size: 38px;
      line-height: 1;
      color: var(--c);
      text-shadow: 0 0 2px var(--g), 0 0 calc(var(--t) * 20px) var(--g);
    }
    .minutes small { display: block; margin-top: 6px; font-family: var(--sans); font-size: 13px; color: var(--muted); text-shadow: none; }
    .num-wrap { position: relative; display: inline-block; }
    .num { position: relative; display: inline-block; }

    /* Dread zone - the number breaks: color split slices (--k), flicker, and at the max a whispered line */
    .num::before, .num::after {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      pointer-events: none;
      text-shadow: none;
      opacity: calc(var(--k, 0) * 0.9);
      mix-blend-mode: screen;
    }
    .num::before { color: var(--glare); transform: translateX(calc(var(--k, 0) * -4px)); animation: slice-a 1.1s steps(1) infinite; }
    .num::after { color: #27e0ff; transform: translateX(calc(var(--k, 0) * 4px)); animation: slice-b 1.6s steps(1) infinite; }
    @keyframes slice-a {
      0% { clip-path: inset(0 0 72% 0); }
      20% { clip-path: inset(40% 0 33% 0); }
      40% { clip-path: inset(82% 0 4% 0); }
      60% { clip-path: inset(12% 0 60% 0); }
      80% { clip-path: inset(55% 0 22% 0); }
    }
    @keyframes slice-b {
      0% { clip-path: inset(60% 0 10% 0); }
      25% { clip-path: inset(5% 0 80% 0); }
      50% { clip-path: inset(30% 0 45% 0); }
      75% { clip-path: inset(70% 0 2% 0); }
    }
    body.flicker .num { animation: flicker 2.3s steps(1) infinite; }
    @keyframes flicker {
      0%, 100% { opacity: 1; transform: none; }
      61% { opacity: 0.25; transform: translateX(3px) skewX(-8deg); }
      62% { opacity: 1; transform: none; }
      81% { transform: translateX(-2px); }
      82% { transform: none; }
    }
    .whisper {
      position: absolute;
      inset: -4px -16px;
      display: none;
      align-items: center;
      justify-content: center;
      background: var(--void);
      color: var(--glare);
      font-family: var(--serif);
      font-size: 24px;
      letter-spacing: 0.15em;
      white-space: nowrap;
      text-shadow: 0 0 10px var(--glare);
    }
    body.max .whisper { display: flex; animation: whisper 3.4s steps(1) infinite; }
    @keyframes whisper {
      0%, 100% { opacity: 0; }
      93% { opacity: 1; }
      96% { opacity: 0; }
    }
    #minutes {
      -webkit-appearance: none;
      appearance: none;
      display: block;
      width: 100%;
      height: 20px;
      margin-top: 10px;
      background: transparent;
      cursor: pointer;
    }
    #minutes:focus { outline: none; }
    #minutes::-webkit-slider-runnable-track {
      height: 2px;
      border-radius: 1px;
      background: linear-gradient(90deg, var(--c) var(--p), var(--gold-faint) var(--p));
      box-shadow: 0 0 calc(var(--t) * 8px) var(--g);
    }
    #minutes::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      margin-top: -6px;
      border-radius: 50%;
      background: var(--c);
      box-shadow: 0 0 calc(4px + var(--t) * 10px) var(--g);
    }
    #minutes:focus-visible::-webkit-slider-thumb { outline: 1px solid var(--bone); outline-offset: 3px; }
    .ticks { display: flex; justify-content: space-between; margin-top: 2px; font-size: 10px; color: var(--muted); }

    /* Buttons - breaking the seal is the heaviest element */
    .buttons { display: flex; flex-direction: column; gap: 10px; width: 100%; margin-top: 10px; }
    button {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      font-family: var(--serif);
      font-size: 15px;
      letter-spacing: 0.3em;
      cursor: pointer;
    }
    #disable {
      border: 1px solid var(--crimson);
      background: var(--blood);
      color: #fff;
      box-shadow: 0 0 18px rgba(200, 40, 60, 0.45);
    }
    #disable:hover { background: #a8182d; }
    #disable:disabled { border-color: #4a1a22; background: #2a0f16; color: var(--muted); box-shadow: none; cursor: not-allowed; }
    #cancel { border: 1px solid var(--gold-soft); background: transparent; color: var(--gold); }
    #cancel:hover { background: var(--gold-faint); }
    #notice { min-height: 1em; font-size: 13px; color: var(--gold); }

    /* Streak confrontation */
    .count { font-family: var(--serif); font-size: 15px; letter-spacing: 0.2em; color: #d9cfc0; }
    .count strong {
      display: block;
      margin: 2px 0 -4px;
      font-size: 64px;
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1;
      color: var(--glare);
      text-shadow: 0 0 22px rgba(255, 42, 61, 0.8);
    }
    .ask { font-family: var(--serif); font-size: 22px; letter-spacing: 0.12em; color: #f0d9d9; }
    .walk { font-size: 14px; line-height: 1.8; color: #d9cfc0; }
    #walk { border: 1px solid var(--gold); background: var(--gold); color: var(--ink); font-weight: 600; }
    #walk:hover { background: #cfa243; }
    #proceed { border: 1px solid var(--crimson); background: transparent; color: var(--crimson); }
    #proceed:hover:not(:disabled) { background: rgba(200, 40, 60, 0.15); }
    #proceed:disabled { border-color: #4a1a22; color: #6a3a42; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="vignette"></div>
  <div class="scan"></div>
  <svg class="eye" viewBox="0 -4 128 120" aria-hidden="true">
    <defs>
      <mask id="lid-mask"><rect x="0" y="-4" width="128" height="124" fill="white"/><circle cx="64" cy="36" r="40" fill="black"/></mask>
      <clipPath id="opening"><path class="lid"/></clipPath>
      <clipPath id="star-a"><circle cx="100" cy="26" r="6"/></clipPath>
      <clipPath id="star-b"><circle cx="84" cy="16" r="4"/></clipPath>
    </defs>
    <g class="widen"><g class="lids">
      <path class="lid" fill="#1a070b"/>
      <g clip-path="url(#opening)"><g class="iris" data-cx="64" data-cy="48" data-reach="7">
        <circle class="iris-glow" cx="64" cy="48" r="19" fill="#ff2a3d"/>
        <ellipse class="pupil" cx="64" cy="48" rx="3.2" ry="3.2" data-r="3.2" data-slit="0.34 3.5" fill="#07070b"/>
      </g></g>
      <path class="lid-band"/>
    </g></g>
    <circle class="tint" cx="64" cy="50" r="40" mask="url(#lid-mask)" style="stroke: none"/>
    <g class="tint" stroke-width="6.5" stroke-linecap="round"><line x1="64" y1="86" x2="64" y2="107.2"/><line x1="41.25" y1="76.95" x2="29.45" y2="95.3"/><line x1="86.75" y1="76.95" x2="98.55" y2="95.3"/></g>
    <!-- Stars of the mark: black discs, each with a red dot that watches on its own -->
    <g class="star">
      <circle class="disc" cx="100" cy="26" r="6" style="--r0: 4.4px; --r1: 6px"/>
      <g clip-path="url(#star-a)"><g class="iris" data-cx="100" data-cy="26" data-reach="3"><g class="dot-lid" style="--period: 5.3s; --after: 2.1s">
        <ellipse class="pupil" cx="100" cy="26" rx="1.92" ry="1.92" data-r="1.92" data-slit="0.45 1.7" fill="#ff2a3d"/>
      </g></g></g>
    </g>
    <g class="star">
      <circle class="disc" cx="84" cy="16" r="4" style="--r0: 2.75px; --r1: 4px"/>
      <g clip-path="url(#star-b)"><g class="iris" data-cx="84" data-cy="16" data-reach="2"><g class="dot-lid" style="--period: 8.9s; --after: 4.4s">
        <ellipse class="pupil" cx="84" cy="16" rx="1.28" ry="1.28" data-r="1.28" data-slit="0.45 1.7" fill="#ff2a3d"/>
      </g></g></g>
    </g>
  </svg>

  <section id="form" class="view">
    <div class="kicker">DANGER ZONE</div>
    <h1>封印を解く</h1>
    <p class="lead">
      ブロックを外すと、おすすめやタイムラインが<br>
      <strong>あなたの時間を奪いに来ます。</strong><br>
      本当に今、それが必要ですか？
    </p>
    <div class="duration">
      <div class="minutes" id="minutes-view">
        <span class="num-wrap"><span class="num" id="minutes-value" data-text="30">30</span><span class="whisper">見てるよ</span></span>
        <small id="minutes-caption">分だけ無効化</small>
      </div>
      <input id="minutes" type="range" min="5" max="120" step="5" value="30" aria-label="無効化する分数">
      <div class="ticks"><span>5</span><span>120</span></div>
    </div>
    <div id="notice"></div>
    <div class="buttons">
      <button id="disable">無効化する</button>
      <button id="cancel">やめておく</button>
    </div>
  </section>

  <section id="confront" class="view" hidden>
    <p class="count">これで<strong id="streak-count" class="num" data-text="2">2</strong>回連続です。</p>
    <p class="ask">本当に必要ですか？？？</p>
    <p class="walk">もし虚ろならば、今すぐ散歩に行きましょう。</p>
    <div class="buttons">
      <button id="walk">散歩に行く</button>
      <button id="proceed" disabled>それでも解く</button>
    </div>
  </section>
  <script type="module" src="./main.ts"></script>
</body>
</html>
