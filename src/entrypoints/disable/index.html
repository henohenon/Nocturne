<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>⚠ Nocturne - 無効化</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #ffecec;
      background: radial-gradient(circle at 50% 35%, #5c0000 0%, #2a0000 55%, #0d0000 100%);
      animation: throb 2.4s ease-in-out infinite;
      user-select: none;
    }
    @keyframes throb {
      0%, 100% { box-shadow: inset 0 0 40px 6px rgba(255, 0, 0, 0.35); }
      50% { box-shadow: inset 0 0 90px 22px rgba(255, 0, 0, 0.65); }
    }
    .tape {
      height: 22px;
      flex: none;
      background: repeating-linear-gradient(-45deg, #ffcc00 0 16px, #111 16px 32px);
      animation: crawl 1.2s linear infinite;
      background-size: 45px 45px;
    }
    @keyframes crawl { to { background-position: 45px 0; } }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 20px 28px;
      text-align: center;
    }
    .sign {
      font-size: 64px;
      line-height: 1;
      color: #ff2d2d;
      text-shadow: 0 0 18px rgba(255, 40, 40, 0.9);
      animation: blink 1s steps(2, start) infinite;
    }
    @keyframes blink { 50% { opacity: 0.35; } }
    h1 {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 0.08em;
      color: #ff3b3b;
      text-shadow: 0 0 10px rgba(255, 0, 0, 0.7);
    }
    .lead { font-size: 14px; line-height: 1.7; color: #ffc9c9; }
    .lead strong { color: #fff; }
    .duration {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
      font-size: 14px;
      color: #ffb3b3;
    }
    #minutes {
      width: 72px;
      padding: 8px;
      border: 2px solid #ff3b3b;
      border-radius: 6px;
      background: #1a0000;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      text-align: center;
    }
    .buttons { display: flex; flex-direction: column; gap: 10px; width: 100%; margin-top: 8px; }
    button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    #disable {
      border: 2px solid #ff3b3b;
      background: #b30000;
      color: #fff;
      letter-spacing: 0.1em;
    }
    #disable:hover { background: #d40000; }
    #disable:disabled { background: #3a1010; border-color: #5a2020; color: #886; cursor: not-allowed; }
    #cancel {
      border: 1px solid #555;
      background: #1c1c1c;
      color: #ccc;
    }
    #cancel:hover { background: #2a2a2a; }
    #notice { font-size: 13px; color: #ffcc00; min-height: 1em; }
  </style>
</head>
<body>
  <div class="tape"></div>
  <main>
    <div class="sign">⚠</div>
    <h1>DANGER ZONE</h1>
    <p class="lead">
      ブロックを外すと、おすすめ動画が<br>
      <strong>あなたの時間を奪いに来ます。</strong><br>
      本当に今、それが必要ですか？
    </p>
    <label class="duration">
      <input id="minutes" type="number" min="1" max="120" value="30">
      分だけ無効化（最大120分）
    </label>
    <div id="notice"></div>
    <div class="buttons">
      <button id="disable">無効化する</button>
      <button id="cancel">やめておく</button>
    </div>
  </main>
  <div class="tape"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
