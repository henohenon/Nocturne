<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nocturne - 封印を解く</title>
  <style>
    :root {
      --ink: #0e0e16;
      --void: #07070b;
      --gold: #bc912f;
      --gold-soft: rgba(188, 145, 47, 0.38);
      --gold-faint: rgba(188, 145, 47, 0.14);
      --bone: #e9e2cf;
      --muted: #8b8575;
      --crimson: #c8283c;
      --blood: #8e1426;
      --glare: #ff2a3d;
      --serif: Georgia, 'Yu Mincho', 'YuMincho', 'Hiragino Mincho ProN', serif;
      --sans: 'Segoe UI', 'Yu Gothic UI', 'Hiragino Sans', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 28px 40px;
      font-family: var(--sans);
      text-align: center;
      color: var(--bone);
      background:
        radial-gradient(ellipse at 50% 26%, rgba(160, 20, 40, 0.45) 0%, rgba(90, 10, 24, 0.2) 40%, transparent 72%),
        var(--void);
      animation: heartbeat 1.6s ease-out infinite;
      user-select: none;
    }
    body.confront { animation-duration: 0.9s; }
    @keyframes heartbeat {
      0%, 36%, 100% { box-shadow: inset 0 0 50px 4px rgba(200, 40, 60, 0.22); }
      8% { box-shadow: inset 0 0 100px 22px rgba(200, 40, 60, 0.55); }
      18% { box-shadow: inset 0 0 60px 8px rgba(200, 40, 60, 0.3); }
      26% { box-shadow: inset 0 0 85px 16px rgba(200, 40, 60, 0.45); }
    }

    /* Double gold frame */
    body::before, body::after { content: ''; position: absolute; pointer-events: none; }
    body::before { inset: 10px; border: 1px solid var(--gold-soft); }
    body::after { inset: 15px; border: 1px solid var(--gold-faint); }

    /* The eye - opens once, blinks now and then, iris follows the cursor */
    .eye { width: 120px; height: 112px; flex: none; overflow: visible; filter: drop-shadow(0 0 16px rgba(220, 40, 60, 0.55)); }
    .eye-open { transform-box: view-box; transform-origin: 64px 60px; animation: open 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 0.5s both; }
    .eye-blink { transform-box: view-box; transform-origin: 64px 60px; animation: blink 7s ease-in-out 2.5s infinite; }
    @keyframes open {
      from { transform: scaleY(0); }
      70% { transform: scaleY(1.08); }
      to { transform: scaleY(1); }
    }
    @keyframes blink {
      0%, 95%, 100% { transform: scaleY(1); }
      97% { transform: scaleY(0.06); }
    }
    #iris { transition: transform 0.12s ease-out; }
    #iris circle:first-child { filter: drop-shadow(0 0 6px rgba(255, 42, 61, 0.9)); }
    body.confront .eye { width: 150px; height: 140px; }

    /* Heading */
    .kicker { font-size: 11px; letter-spacing: 0.42em; color: var(--gold); }
    h1 {
      font-family: var(--serif);
      font-size: 30px;
      font-weight: 400;
      letter-spacing: 0.18em;
      color: #f0d9d9;
      text-shadow: 0 0 14px rgba(220, 40, 60, 0.6);
    }
    .lead { font-size: 14px; line-height: 1.8; color: #d9cfc0; }
    .lead strong { font-weight: 600; color: #fff; }

    /* Views - main form and the streak confrontation swap in place */
    .view { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; }
    .view[hidden] { display: none; }

    /* Duration input */
    .duration {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-top: 4px;
      font-size: 13px;
      color: var(--muted);
    }
    #minutes {
      width: 64px;
      padding: 0 0 2px;
      border: none;
      border-bottom: 1px solid var(--gold);
      background: transparent;
      color: var(--bone);
      font-family: var(--serif);
      font-size: 26px;
      text-align: center;
    }
    #minutes:focus { outline: none; border-bottom-color: var(--bone); }

    /* Buttons - breaking the seal is the heaviest element */
    .buttons { display: flex; flex-direction: column; gap: 10px; width: 100%; margin-top: 10px; }
    button {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      font-family: var(--serif);
      font-size: 15px;
      letter-spacing: 0.3em;
      cursor: pointer;
    }
    #disable {
      border: 1px solid var(--crimson);
      background: var(--blood);
      color: #fff;
      box-shadow: 0 0 18px rgba(200, 40, 60, 0.45);
    }
    #disable:hover { background: #a8182d; }
    #disable:disabled { border-color: #4a1a22; background: #2a0f16; color: var(--muted); box-shadow: none; cursor: not-allowed; }
    #cancel { border: 1px solid var(--gold-soft); background: transparent; color: var(--gold); }
    #cancel:hover { background: var(--gold-faint); }
    #notice { min-height: 1em; font-size: 13px; color: var(--gold); }

    /* Streak confrontation */
    .count { font-family: var(--serif); font-size: 15px; letter-spacing: 0.2em; color: #d9cfc0; }
    .count strong {
      display: block;
      margin: 2px 0 -4px;
      font-size: 64px;
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1;
      color: var(--glare);
      text-shadow: 0 0 22px rgba(255, 42, 61, 0.8);
    }
    .ask { font-family: var(--serif); font-size: 22px; letter-spacing: 0.12em; color: #f0d9d9; }
    .walk { font-size: 14px; line-height: 1.8; color: #d9cfc0; }
    #walk { border: 1px solid var(--gold); background: var(--gold); color: var(--ink); font-weight: 600; }
    #walk:hover { background: #cfa243; }
    #proceed { border: 1px solid var(--crimson); background: transparent; color: var(--crimson); }
    #proceed:hover:not(:disabled) { background: rgba(200, 40, 60, 0.15); }
    #proceed:disabled { border-color: #4a1a22; color: #6a3a42; cursor: not-allowed; }
  </style>
</head>
<body>
  <svg class="eye" viewBox="0 -4 128 120" aria-hidden="true">
    <defs>
      <mask id="lid"><rect x="0" y="-4" width="128" height="124" fill="white"/><circle cx="64" cy="36" r="40" fill="black"/></mask>
      <clipPath id="opening"><path d="M24.6 45 Q64 -8 103.4 45 A40 40 0 0 1 24.6 45 Z"/></clipPath>
    </defs>
    <g class="eye-open"><g class="eye-blink">
      <path d="M24.6 45 Q64 -8 103.4 45 A40 40 0 0 1 24.6 45 Z" fill="#1a070b"/>
      <g clip-path="url(#opening)"><g id="iris">
        <circle cx="64" cy="48" r="19" fill="#ff2a3d"/>
        <circle cx="64" cy="48" r="3.2" fill="#07070b"/>
      </g></g>
      <path d="M24.6 45 Q64 -8 103.4 45 Q64 4 24.6 45 Z" fill="#8e1426"/>
    </g></g>
    <circle cx="64" cy="50" r="40" fill="#8e1426" mask="url(#lid)"/>
    <g stroke="#8e1426" stroke-width="6.5" stroke-linecap="round"><line x1="64" y1="86" x2="64" y2="107.2"/><line x1="41.25" y1="76.95" x2="29.45" y2="95.3"/><line x1="86.75" y1="76.95" x2="98.55" y2="95.3"/></g>
  </svg>

  <section id="form" class="view">
    <div class="kicker">DANGER ZONE</div>
    <h1>封印を解く</h1>
    <p class="lead">
      ブロックを外すと、おすすめ動画が<br>
      <strong>あなたの時間を奪いに来ます。</strong><br>
      本当に今、それが必要ですか？
    </p>
    <label class="duration">
      <input id="minutes" type="number" min="1" max="120" value="30">
      分だけ無効化（最大120分）
    </label>
    <div id="notice"></div>
    <div class="buttons">
      <button id="disable">無効化する</button>
      <button id="cancel">やめておく</button>
    </div>
  </section>

  <section id="confront" class="view" hidden>
    <p class="count">これで<strong id="streak-count">2</strong>回連続です。</p>
    <p class="ask">本当に必要ですか？？？</p>
    <p class="walk">もし虚ろならば、今すぐ散歩に行きましょう。</p>
    <div class="buttons">
      <button id="walk">散歩に行く</button>
      <button id="proceed" disabled>それでも解く</button>
    </div>
  </section>
  <script type="module" src="./main.ts"></script>
</body>
</html>
