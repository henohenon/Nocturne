<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube Overlay</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 220px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      background: #1a1a1a;
      color: #eee;
    }
    h1 { font-size: 13px; color: #888; margin-bottom: 12px; letter-spacing: 0.05em; }
    #status {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 14px;
      color: #4caf50;
    }
    #status.disabled { color: #ff9800; }
    #toggle {
      width: 100%;
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      background: #333;
      color: #eee;
      transition: background 0.15s;
    }
    #toggle:hover { background: #444; }
    #toggle.active { background: #2e5a2e; color: #8bc34a; }
  </style>
</head>
<body>
  <h1>YOUTUBE OVERLAY</h1>
  <div id="status">有効</div>
  <button id="toggle">3分間 無効化</button>
  <script src="popup.js"></script>
</body>
</html>
